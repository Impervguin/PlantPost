services:
  pg:
    container_name: pg_test
    hostname: pg_test
    image: postgres:17.4-alpine3.20
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=testtesttest
      - POSTGRES_DB=plantpost
      - POSTGRES_PORT=5432
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d plantpost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    networks:
      - pg-net

  pg-migrations:
    container_name: pg-migrations_test
    build:
      context: ../
      dockerfile: ./pg.dockerfile
    command: "migr up"
    volumes:
      - ../migrations/postgres:/migrations
      - ../config/migr.test.yaml:/build/config/pgmigr.yaml
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - pg-net

  minio:
    container_name: minio_test
    hostname: minio_test
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z-cpuv1
    command: server --console-address ":9001" --address ":9000" /data
    ports:
      - "29453:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MINIO_ROOT_USER=test
      - MINIO_ROOT_PASSWORD=testtesttest
      - MINIO_PORT=9000
      - MINIO_CONSOLE_PORT=9001
    networks:
      - minio-net

networks:
  pg-net:
    driver: bridge
  minio-net:
    driver: bridge
